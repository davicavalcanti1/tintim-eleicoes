<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Eleições 2026 · tintim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Presidente 2026, seção por seção: resultados oficiais do TSE de cada cidade e de cada local de votação, nos dois turnos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cabeçalho marinho (tintim) · Mapa = coluna (resultado, modo, legenda, filtros) + mapa 3D único;
   abaixo, faixa larga com a tabela de valores e as comparações. No celular tudo empilha e o detalhe abre como folha.
   Tema claro do tintim / Painel Brasil em Números. */
:root {
  color-scheme: light;
  --bg: #f3f5f8; --panel: #ffffff; --ink: #0d1726; --ink-2: #46536a; --ink-3: #6b778c;
  --line: #e6e9ef; --line-2: #eef1f5; --accent: #1c5cab; --accent-soft: #eaf1fb;
  --marinho: #0b1a33; --marinho-tinta: #c5d3ea; --coral: #e4684f;
  --lula: #d93a3a; --flavio: #2f6bd0; --lula-ink: #a92424; --flavio-ink: #1d4f9f;
  --outros: #a7a29a; --branco: #c9cfd9; --nulo: #8a94a6; --abst: #46536a;
  --t-a: #c3c9d4; --t-b: #7d8798; --t-c: #2b3445; --warn: #b8620a;
  --queda: #1f8a8a; --alta: #a35d2a;
  --terra: #e9edf3; --parede: #b9c3d3; --parede-2: #8796ad; --map-sea: #f3f5f8; --map-land: #e9edf3; --map-edge: #b9c3d3;
  --sombra: 0 1px 2px rgba(13, 23, 38, 0.04), 0 8px 24px rgba(13, 23, 38, 0.06);
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--marinho); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--marinho); color: #fff; }
header.top .dentro { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 10px 20px; padding-block: 10px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; min-width: 0; }
.marca svg { height: 24px; width: auto; flex: none; }
.marca .traco { stroke: #fff; } .marca .pingo { fill: #f08a72; }
.marca span { border-left: 1px solid rgba(255,255,255,.2); padding-left: 12px; font-weight: 700; font-size: 15px; white-space: nowrap; }
nav.abas { display: flex; gap: 4px; margin-left: auto; }
nav.abas a { color: var(--marinho-tinta); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
nav.abas a:hover { background: rgba(255,255,255,.08); color: #fff; }
nav.abas a[aria-current="page"] { background: #fff; color: var(--marinho); }

#v-mapa { max-width: 1440px; margin: 0 auto; padding-block: 16px 32px; }
.grade-mapa { display: grid; grid-template-columns: minmax(330px, 400px) 1fr; gap: 16px; align-items: start; }
.coluna { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cartao { background: var(--panel); border: 1px solid rgba(13,23,38,.08); border-radius: 16px; box-shadow: var(--sombra); padding: 16px; min-width: 0; }
.cartao h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin: 0 0 10px; }
.faixa-numeros { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }

.res-tit { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.res-tit b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.res-tit span { font-size: 12px; color: var(--ink-3); }
.cands { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cand { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cand .topo-c { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cand img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; flex: none; border: 3px solid var(--cor); background: var(--line-2); }
.cand .nome { font-weight: 700; font-size: 14px; line-height: 1.2; min-width: 0; }
.cand .nome small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12px; }
.cand .pct { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--cor-ink); }
.cand .pct small { font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 4px; }
.cand .votos { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cand .trilho { height: 6px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.cand .trilho i { display: block; height: 100%; background: var(--cor); border-radius: 99px; }
.selo-lider { align-self: flex-start; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--cor-ink); background: var(--line-2); padding: 2px 8px; border-radius: 99px; }
.outros-c { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--ink-2); }
.outros-c span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.outros-c img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; }
.extras { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.extras div { background: var(--line-2); border-radius: 10px; padding: 7px 9px; min-width: 0; }
.extras b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.extras span { font-size: 11.5px; color: var(--ink-3); }

.modos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.modo { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.modo b { display: block; font-size: 14px; font-weight: 700; line-height: 1.25; }
.modo span { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.3; margin-top: 2px; }
.modo[aria-pressed="true"] { border-color: var(--marinho); background: var(--accent-soft); }
.modo.largo { grid-column: 1 / -1; }
.pergunta { margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--line-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); cursor: pointer; line-height: 1.2; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(13,23,38,.12); }
.campo { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
.campo label, .campo .rot { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.campo select, .campo input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 14.5px; min-width: 0; }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dois .campo { min-width: 0; }
.legenda { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.rampa { height: 10px; border-radius: 99px; }
.rampa-eixo { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-3); gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.nota { font-size: 12px; color: var(--ink-3); }

.tab { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tab th, .tab td { padding: 7px 6px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
.tab th:first-child, .tab td:first-child { text-align: left; white-space: normal; }
.tab thead th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.tab thead th button { all: unset; cursor: pointer; }
.tab thead th button:focus-visible { outline: 2px solid var(--coral); }
.tab tbody tr.clica { cursor: pointer; }
.tab tbody tr.clica:hover { background: var(--line-2); }
.tab .l { color: var(--lula-ink); font-weight: 600; }
.tab .f { color: var(--flavio-ink); font-weight: 600; }
.tab .d { font-weight: 700; }
.tab .grupo td { background: var(--line-2); font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.rolagem { max-height: 560px; overflow: auto; }
.mais { margin-top: 10px; }
.abas-comp { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.abas-comp button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.abas-comp button[aria-pressed="true"] { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.leitura-c { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }

.mapa-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); height: calc(100vh - 100px); min-height: 480px; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #eef2f7 55%, #e3e9f1 100%); border: 1px solid rgba(13,23,38,.08); box-shadow: var(--sombra); }
#mapa { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; display: block; }
#mapa.arrastando { cursor: grabbing; }
.ferr { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.ferr button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--sombra); font-weight: 700; font-size: 17px; cursor: pointer; color: var(--ink); }
.ferr button.txt { font-size: 12px; }
.ferr button[aria-pressed="true"] { background: var(--marinho); color: #fff; border-color: var(--marinho); }
.selo-mapa { position: absolute; left: 12px; top: 12px; z-index: 2; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); max-width: calc(100% - 80px); box-shadow: var(--sombra); }
.selo-mapa b { color: var(--ink); }
.camada-mapa { position: absolute; left: 12px; bottom: 12px; z-index: 2; width: min(300px, calc(100% - 24px)); box-shadow: var(--sombra); background: rgba(238,241,245,.96); }
.carregando { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 14px; pointer-events: none; z-index: 1; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(13,23,38,.14); max-width: 260px; z-index: 3; }
.tip b { display: block; }

.detalhe { position: absolute; right: 12px; top: 64px; bottom: 12px; width: min(520px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(13,23,38,.18); display: flex; flex-direction: column; z-index: 4; }
.detalhe header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: start; }
.detalhe header div { flex: 1; min-width: 0; }
.detalhe h3 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.detalhe .end { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.fechar { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 18px; flex: none; }
.detalhe .corpo { overflow: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.barras { display: flex; flex-direction: column; gap: 8px; }
.barra-linha { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.barra { display: flex; height: 20px; gap: 2px; min-width: 0; }
.barra span { height: 100%; min-width: 1px; }
.barra span:first-child { border-radius: 5px 0 0 5px; }
.barra span:last-child { border-radius: 0 5px 5px 0; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.mini td, .mini th { padding: 6px 4px; border-bottom: 1px solid var(--line-2); text-align: right; }
.mini td:first-child, .mini th:first-child { text-align: left; }
.mini th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 999px; font-weight: 600; font-size: 14.5px; border: 1.5px solid var(--marinho); background: var(--marinho); color: #fff; cursor: pointer; text-decoration: none; }
.botao.claro { background: var(--panel); color: var(--marinho); }
.tab-sec { overflow-x: auto; }
.tab-sec table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab-sec th, .tab-sec td { padding: 5px 7px; border-bottom: 1px solid var(--line-2); text-align: right; }
.tab-sec thead th { position: sticky; top: 0; background: var(--panel); font-weight: 600; color: var(--ink-3); font-size: 11px; }
.tab-sec .grp { text-align: center; border-bottom: 1px solid var(--line); }
.tab-sec td.sep, .tab-sec th.sep { border-left: 1px solid var(--line); }
.flag { color: var(--warn); font-weight: 700; }

@media (max-width: 1100px) { .faixa-numeros { grid-template-columns: 1fr; } }
@media (max-width: 899px) {
  .grade-mapa { grid-template-columns: 1fr; gap: 12px; }
  .coluna { display: contents; }
  #c-resultado { order: 1; }
  #c-modo { order: 2; }
  .mapa-wrap { order: 3; position: relative; top: 0; height: clamp(320px, min(70vh, 112vw), 660px); min-height: 0; border-radius: 16px; }
  #c-legenda { order: 4; }
  #c-filtros { order: 5; }
  .faixa-numeros { margin-top: 12px; gap: 12px; }
  .detalhe { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 82vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 40; }
  .detalhe::before { content: ""; width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 8px auto 0; flex: none; }
  .selo-mapa { font-size: 12px; padding: 6px 10px; }
  .ferr button { width: 38px; height: 38px; }
  .camada-mapa { width: auto; right: 62px; }
  .rolagem { max-height: none; overflow: visible; }
  .tab thead th { position: static; }
}
@media (max-width: 640px) {
  .tab-sec { overflow: visible; }
  .tab-sec thead { display: none; }
  .tab-sec table, .tab-sec tbody, .tab-sec tr, .tab-sec td { display: block; width: 100%; white-space: normal; }
  .tab-sec tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: grid !important; grid-template-columns: 1fr 1fr; column-gap: 16px; }
  .tab-sec td { display: flex; justify-content: space-between; gap: 8px; border: 0; padding: 2px 0; min-width: 0; }
  .tab-sec td::before { content: attr(data-label); color: var(--ink-3); font-size: 12px; text-align: left; }
  .tab-sec td:nth-child(1), .tab-sec td:nth-child(2) { font-weight: 700; }
  .tab-sec td.sep { border-left: 0; }
  .marca span { display: none; }
  .tab.cartoes thead { display: none; }
  .tab.cartoes, .tab.cartoes tbody, .tab.cartoes tr, .tab.cartoes td { display: block; width: 100%; }
  .tab.cartoes tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: grid !important; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .tab.cartoes tr.grupo { display: block !important; border: 0; padding: 4px 0 0; margin: 4px 0; }
  .tab.cartoes tr.grupo td { background: none; padding: 0; }
  .tab.cartoes td { display: flex; justify-content: space-between; gap: 8px; border: 0; padding: 2px 0; white-space: normal; min-width: 0; }
  .tab.cartoes td::before { content: attr(data-label); color: var(--ink-3); font-size: 12px; font-weight: 500; text-align: left; }
  .tab.cartoes td:first-child { grid-column: 1 / -1; font-weight: 700; font-size: 14px; padding-bottom: 4px; }
  .tab.cartoes td:first-child::before { content: none; }
  .ordem-cel { display: flex !important; }
}
.ordem-cel { display: none; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12.5px; color: var(--ink-3); }
.ordem-cel select { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
@media (max-width: 400px) {
  .cand { padding: 10px; gap: 6px; }
  .cand img { width: 40px; height: 40px; border-width: 2px; }
  .cand .pct { font-size: 23px; }
  .cand .nome { font-size: 13px; }
  .seg button { font-size: 12.5px; padding: 8px 4px; }
  .dois { grid-template-columns: 1fr; gap: 0; }
  nav.abas a { padding: 6px 10px; font-size: 13px; }
  .extras b { font-size: 13.5px; }
  .modo { padding: 9px 10px; }
  .modo span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Relatórios ---------- */
#v-rel { flex: 1; overflow-y: auto; }
.rel { max-width: 920px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rel-indice { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin: 10px 0 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.rel-indice a { color: var(--accent); text-decoration: none; }
.rel h1 { font-family: var(--display); font-weight: 650; font-size: 30px; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
.rel h2 { font-family: var(--display); font-weight: 650; font-size: 22px; margin: 44px 0 6px; text-wrap: balance; }
.rel h3 { font-size: 15px; font-weight: 600; margin: 24px 0 6px; }
.rel p, .rel li { max-width: 68ch; color: var(--ink); }
.rel .sub { color: var(--ink-2); font-size: 15px; max-width: 68ch; }
.rel .rot { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.leitura { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 14px 0; max-width: 72ch; }
.leitura p { margin: 4px 0; }
.veredito { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); }
.v-ok { color: var(--accent); }
.v-parcial { color: var(--warn); }
.tabela { overflow-x: auto; margin: 10px 0; }
.tabela table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 100%; }
.tabela th, .tabela td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
.tabela th:first-child, .tabela td:first-child { text-align: left; white-space: normal; }
.tabela thead th { color: var(--ink-3); font-size: 11.5px; font-weight: 600; border-bottom: 1px solid var(--line); }
.baixar { display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 18px; padding: 8px 14px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; }
.comp { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.comp-linha { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; }

/* ---------------- Estado da tela ---------------- */

  res: { nome: "Quem venceu", pergunta: "Quem teve mais votos em cada lugar. Cor mais forte, vitória mais larga.", rot: "Turno", opc: [["2", "2º turno"], ["1", "1º turno"]] },

const med = () => E.opc[E.modo];

  const fx = new Uint8Array(4); FAIXAS[E.recorte].forEach(f => fx[f] = 1);

const UNID = { "2": "pp", "1": "pp", dmar: "pp", dlula: "pp", dflavio: "pp", dabst: "pp", dbn: "pp", abst2: "%", abst1: "%", bn2: "%", bn1: "%", tarde: "%", s19: "%", atip: "" };

/* ---------------- Desenho 3D ---------------- */
const cv = $("#mapa"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, V = { s: 1, x: 0, y: 0 }, enq = false, sel = null;
const TILT = () => E.tres ? 0.8 : 1;
const PROF = () => E.tres ? Math.max(8, Math.min(16, V.s * 1.2)) : 0;

function enquadra(x0, y0, x1, y1) {

function enquadraSel() {

    el.innerHTML = barras({ cats: ordem.map(o => nome[o]), series: [{ nome: "Lula", cor: "var(--lula)", v: ordem.map(o => r[o].lula / 1e6) }, { nome: "Flávio", cor: "var(--flavio)", v: ordem.map(o => r[o].flavio / 1e6) }], yfmt: v => pf(v, 1) + " mi", w: larg(el) });
  },
  lider(el) {
    const g = GAN.lider.slice().sort((a, b) => a.grupo < b.grupo ? -1 : 1);
    el.innerHTML = barras({ cats: g.map(x => x.grupo.replace(" no 1º turno", "")), series: [{ nome: "Votos ganhos por Lula", cor: "var(--lula)", v: g.map(x => x.lula / 1e6) }, { nome: "Votos ganhos por Flávio", cor: "var(--flavio)", v: g.map(x => x.flavio / 1e6) }], yfmt: v => pf(v, 1) + " mi", w: larg(el) });
  },
};



/* ---------------- Início ---------------- */
lePaleta(); montaModo(); montaRampa(); rota();
</script>
